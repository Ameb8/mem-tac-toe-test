name: "student_dual"
build_cmd: "make clean && make"
work_dir: "mock_submissions/dual_shm"

topology: "dual"
launch_p1: ["./player1", "{N}"]
launch_p2: ["./player2"]
creator: "p1"
starting_player: "p1"

coord_base: 0
coord_order: "row_col"
input_format: "{r} {c}\n"

turn_prompt: "Enter move"
settling_ms: 100
timeout_sec: 5
session_timeout_sec: 30
